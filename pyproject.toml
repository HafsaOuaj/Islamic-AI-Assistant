[project]
name = "islamic-ai-assistant"
version = "0.1.0"
description = "Islamic multi-agents assitant that help you live a better life as Muslim"
authors = [
    {name = "hOuajdi"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "torch (>=2.11.0,<3.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "huggingface-hub (>=1.11.0,<2.0.0)",
    "kagglehub (>=1.0.0,<2.0.0)",
    "annotated-types (>=0.7.0,<0.8.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "protobuf (==3.20.3)",
    "ollama (>=0.6.2,<0.7.0)",
    "anthropic (>=0.103.1,<0.104.0)",
    "plotly (>=6.7.0,<7.0.0)",
    "nbformat (>=4.2.0)",
    "transformers (>=4.44.2,<6.0.0)",
    "flagembedding (>=1.4.0,<2.0.0)",
    "fastapi[standard] (>=0.136.3,<0.137.0)",
    "rouge-metric (>=1.0.1,<2.0.0)",
    "evaluate (>=0.4.6,<0.5.0)",
    "bert-score (>=0.3.13,<0.4.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
